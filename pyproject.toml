[project]
name = "lugano-scout"
version = "0.1.0"
description = "AI accommodation-search agent for Ticino — Agno AgentOS, MCP, swappable models (Gemini/Apertus)"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
dependencies = [
    "agno>=3.0,<4",
    "fastmcp>=4.0,<5",
    "google-genai>=2.0",
    "mcp>=2.0",
    "fastapi[standard]>=0.130",
    "python-dotenv>=1.0",
]

[tool.uv]
package = false
